name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-universal
          - platform: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Portable Windows build: a single .exe, no installer.
      - if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npx tauri build --no-bundle
          mkdir out
          cp src-tauri/target/release/claude-usage-checker.exe "out/Claude Usage Checker.exe"

      # Portable macOS build: a zipped .app you can run from anywhere.
      - if: matrix.platform == 'macos-latest'
        run: |
          npx tauri build --target universal-apple-darwin --bundles app
          mkdir out
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Claude Usage Checker.app" "out/Claude Usage Checker-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-checker-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
